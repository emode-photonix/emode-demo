name: Tests

# The setup cell against mocks: no network, no EMode, no credential requests.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  setup-cell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install --quiet pytest "emodeconnection==$(python ci/client_version.py)"

      - name: Test
        run: python -m pytest -q tests
